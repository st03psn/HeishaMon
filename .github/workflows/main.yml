name: Build binary

on:
  push:
    branches-ignore:
      - main        # never run on plain main pushes
    tags:
      - '**'        # but DO run on any tag (including tags on main)
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # nightly at 2am UTC

permissions:
  contents: write
  pull-requests: write   # release builds of Egyras/HeishaMon open a PR adding the binaries to binaries/

env:
  ARDUINO_BOARD_MANAGER_ADDITIONAL_URLS: "http://arduino.esp8266.com/stable/package_esp8266com_index.json https://espressif.github.io/arduino-esp32/package_esp32_dev_index.json"

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test Modbus register map
        run: python3 tests/modbus/run_tests.py

      - name: Test webserver
        run: python3 tests/webserver/run_tests.py

      - name: Test web login
        run: python3 tests/webauth/run_tests.py

      - name: Test HTTPS (certificate, TLS, glue)
        run: python3 tests/https/run_tests.py

      - name: Test boot button and setup hotspot
        run: python3 tests/setupap/run_tests.py

      - name: Test flow temperature limit
        run: python3 tests/flowlimit/run_tests.py

      - name: Test command encoding
        run: python3 Tools/test_commands.py

      - name: Test decoding
        run: python3 Tools/test_decode.py

      - name: Set version env var
        run: echo "GIT_SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        shell: bash

      # A tag v<version> is a release of the fork: the board must report
      # <version> without the leading "v", because the Home Assistant
      # integration compares that with the tag of the latest release (also
      # without "v") and builds the asset names from it. Other tags keep the
      # old behaviour (version = tag name, prerelease).
      - name: Set build type env var
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then
            VERSION="${REF_NAME#v}"
            # digits first (otherwise the integration never offers it), and only
            # characters that are safe in asset names, URLs and version.h
            if ! [[ "$VERSION" =~ ^[0-9][0-9A-Za-z.-]*$ ]]; then
              echo "::error::Release tag '$REF_NAME' must look like v<digits>[.<digits>...][-suffix], e.g. v4.4.1-st03psn.1"
              exit 1
            fi
            echo "BUILD_TYPE=Release" >> $GITHUB_ENV
            echo "VERSION=$VERSION" >> $GITHUB_ENV
          elif [[ "$REF" == refs/tags/* ]]; then
            echo "BUILD_TYPE=Release" >> $GITHUB_ENV
            echo "VERSION=$REF_NAME" >> $GITHUB_ENV
          elif [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            echo "BUILD_TYPE=Nightly" >> $GITHUB_ENV
            echo "VERSION=Nightly-${{ env.GIT_SHORT_SHA }}" >> $GITHUB_ENV
          else
            echo "BUILD_TYPE=Alpha" >> $GITHUB_ENV
            echo "VERSION=Alpha-${{ env.GIT_SHORT_SHA }}" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Update version.h
        if: github.ref != 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          cd HeishaMon && sed -i "s|#define HEISHAMON_VERSION .*|#define HEISHAMON_VERSION \"$VERSION\"|" version.h && cat version.h
          grep -qF "#define HEISHAMON_VERSION \"$VERSION\"" version.h
        shell: bash

      # arduino/setup-arduino-cli still targets the deprecated Node.js 20,
      # so use the install script of arduino-cli itself.
      - name: Setup Arduino CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Install platform
        run: |
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266@3.1.2
          arduino-cli core install esp32:esp32@3.3.11

      - name: Install dependencies
        run: |
          arduino-cli lib install ringbuffer pubsubclient arduinojson dallastemperature onewire "Adafruit NeoPixel" "Async TCP"
          # eModbus is not in the Arduino library registry, install it from git (commit of tag v1.7.5stable)
          ARDUINO_LIBRARY_ENABLE_UNSAFE_INSTALL=true arduino-cli lib install --git-url https://github.com/eModbus/eModbus.git#8cdbcc9c28efad2ad7fbb140af8fa6c6e69bf0fa

      - name: Compile Sketch for ESP8266
        run: cd HeishaMon && arduino-cli compile --output-dir . --fqbn=esp8266:esp8266:d1_mini:xtal=160,vt=flash,ssl=basic,mmu=3216,non32xfer=fast,eesz=4M2M,ip=lm2f,dbg=Disabled,lvl=None____,wipe=none,baud=921600 --warnings=none --verbose HeishaMon.ino

      - name: Add MD5 checksum to ESP8266 binary
        run: |
          cd HeishaMon
          MD5=`md5sum HeishaMon.ino.bin | cut -d\  -f1`
          mv HeishaMon.ino.bin HeishaMon_ESP8266-${{ env.BUILD_TYPE }}-$MD5.bin
          echo "MD5_ESP8266=$MD5" >> $GITHUB_ENV
        shell: bash

      - name: Compile Sketch for ESP32
        run: cd HeishaMon && arduino-cli compile --output-dir . --fqbn=esp32:esp32:esp32s3:CDCOnBoot=cdc,PSRAM=enabled,PartitionScheme=min_spiffs --warnings=none --verbose HeishaMon.ino

      - name: Add MD5 checksum to ESP32 binary
        run: |
          cd HeishaMon
          MD5=`md5sum HeishaMon.ino.bin | cut -d\  -f1`
          mv HeishaMon.ino.bin HeishaMon_ESP32-${{ env.BUILD_TYPE }}-$MD5.bin
          echo "MD5_ESP32=$MD5" >> $GITHUB_ENV
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Heishamon-firmware-${{ env.BUILD_TYPE }}-${{ env.GIT_SHORT_SHA }}
          path: |
            HeishaMon/HeishaMon_*.bin
            HeishaMon/HeishaMon.ino.map

      # Delete the release together with its tag, so the new one gets the
      # current commit and date instead of those of the first nightly.
      - name: Delete old nightly release
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: gh release delete nightly --cleanup-tag --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

      - name: Publish nightly release
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: "Nightly build (${{ env.GIT_SHORT_SHA }})"
          body: |
            Automated nightly build from `main` branch.
            Commit: ${{ github.sha }}
            Built: ${{ github.run_id }}
          prerelease: true
          files: HeishaMon/HeishaMon_*.bin

      # Tags that do not start with "v" (test tags) keep the old behaviour:
      # a prerelease with the md5-named binaries.
      - name: Publish prerelease for other tags
        if: startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: "Release ${{ github.ref_name }}"
          body: |
            Release ${{ github.ref_name }}
            Commit: ${{ github.sha }}
          prerelease: true
          files: HeishaMon/HeishaMon_*.bin

      # The Home Assistant integration (custom_components/aquarea/update.py)
      # reads releases/latest, which ignores prereleases and drafts, and
      # downloads these assets by exact name:
      #   HeishaMon.ino.esp32-v<version>.bin / .md5   (large board, ESP32-S3)
      #   HeishaMon.ino.d1-v<version>.bin / .md5      (small board, ESP8266)
      # <version> is the tag without "v", the same as the board reports.
      - name: Prepare release assets and notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release
          cp "HeishaMon/HeishaMon_ESP32-Release-$MD5_ESP32.bin" "release/HeishaMon.ino.esp32-v$VERSION.bin"
          echo "$MD5_ESP32" > "release/HeishaMon.ino.esp32-v$VERSION.md5"
          cp "HeishaMon/HeishaMon_ESP8266-Release-$MD5_ESP8266.bin" "release/HeishaMon.ino.d1-v$VERSION.bin"
          echo "$MD5_ESP8266" > "release/HeishaMon.ino.d1-v$VERSION.md5"
          (cd release && for f in *.bin; do [ "$(md5sum "$f" | cut -d' ' -f1)" = "$(cat "${f%.bin}.md5")" ] || { echo "::error::checksum of $f"; exit 1; }; done)
          ls -l release
          # Release notes: the message of an annotated tag (checkout turns the
          # tag into a lightweight one, so fetch it again), else a short line.
          # The changes since the previous release are appended by GitHub.
          git fetch --force --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG" || echo "::warning::could not fetch tag $TAG again, using short release notes"
          if [ "$(git cat-file -t "refs/tags/$TAG")" = "tag" ]; then
            git for-each-ref --format='%(contents:subject)%0a%0a%(contents:body)' "refs/tags/$TAG" > release-notes.md
          else
            echo "HeishaMon $TAG" > release-notes.md
          fi
          printf '\nCommit: %s\n' "${{ github.sha }}" >> release-notes.md
          cat release-notes.md
        shell: bash

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: "HeishaMon ${{ github.ref_name }}"
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: false
          draft: false
          make_latest: true
          files: |
            release/HeishaMon.ino.esp32-v${{ env.VERSION }}.bin
            release/HeishaMon.ino.esp32-v${{ env.VERSION }}.md5
            release/HeishaMon.ino.d1-v${{ env.VERSION }}.bin
            release/HeishaMon.ino.d1-v${{ env.VERSION }}.md5
            HeishaMon/HeishaMon_*.bin
          fail_on_unmatched_files: true

      # Only for the original project, which publishes its firmware in
      # binaries/ on main (the integration falls back to that folder only for
      # Egyras/HeishaMon). The fork ships its firmware as release assets only:
      # committing every image would bloat the history, and its main branch is
      # not where the fork is developed.
      - name: Open PR adding release binaries to binaries/
        if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'Egyras/HeishaMon'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          BRANCH="release-binaries-$TAG"
          # Work on a clean checkout of main, the tag checkout has a modified version.h
          git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          git worktree add -b "$BRANCH" ../release-binaries origin/main
          cp "HeishaMon/HeishaMon_ESP32-Release-$MD5_ESP32.bin" "../release-binaries/binaries/model-type-large/HeishaMon.ino.esp32-$TAG.bin"
          echo -n "$MD5_ESP32" > "../release-binaries/binaries/model-type-large/HeishaMon.ino.esp32-$TAG.md5"
          cp "HeishaMon/HeishaMon_ESP8266-Release-$MD5_ESP8266.bin" "../release-binaries/binaries/model-type-small/HeishaMon.ino.d1-$TAG.bin"
          echo -n "$MD5_ESP8266" > "../release-binaries/binaries/model-type-small/HeishaMon.ino.d1-$TAG.md5"
          cd ../release-binaries
          sed -i "s/^The latest production release is .*\./The latest production release is $TAG./" binaries/README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add binaries/
          git commit -m "release $TAG binaries"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Release $TAG binaries" \
            --body "Adds the $TAG firmware built by release run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} to binaries/ and updates binaries/README.md."
        shell: bash
