name: Heat pump report
description: Tell us which values and commands work on your heat pump model. The "Report to HeishaMon" button on the HeishaMon web page fills in most fields.
title: "Heat pump report: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Reports from all series (H, J, K, L, M) help to confirm which topics and commands work on which models, and new model bytes go into [HeatPumpType.md](https://github.com/heishamon/HeishaMon/blob/main/HeatPumpType.md).

        The fields below are filled in by the **Report to HeishaMon** button on the "Heatpump Values" panel of your HeishaMon. Please check them before you submit; nothing is sent until you submit the form. If your model bytes are not listed in HeatPumpType.md yet, the button sets the title to "New model: ..."; please fill in the indoor and outdoor unit so that the model can be added.
  - type: input
    id: version
    attributes:
      label: HeishaMon firmware version
      description: Shown at the top of the HeishaMon web page.
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Board
      placeholder: ESP8266 (small) or ESP32-S3 (large)
    validations:
      required: true
  - type: input
    id: model_bytes
    attributes:
      label: Model bytes (TOP92)
      placeholder: 12 D7 0C 98 14 35 94 0D 83 10
    validations:
      required: true
  - type: dropdown
    id: series
    attributes:
      label: Series
      options:
        - H
        - J
        - K
        - L
        - M
        - Not known
    validations:
      required: true
  - type: input
    id: indoor_unit
    attributes:
      label: Indoor unit model
      description: From the type plate, for example WH-SDC0316M9E8. Write "monobloc" for a monobloc unit.
  - type: input
    id: outdoor_unit
    attributes:
      label: Outdoor unit model
      description: From the type plate, for example WH-WXG09ME8.
  - type: textarea
    id: values
    attributes:
      label: Values from HeishaMon
      description: One line per topic (TOPn, XTOPn or OPTn, then "=" and the value; names in MQTT-Topics.md). Filled in by the button.
      render: text
    validations:
      required: true
  - type: dropdown
    id: matches
    attributes:
      label: Do the values match the remote controller or the Aquarea Service Cloud?
      options:
        - Checked, all match
        - Checked, some differ (see below)
        - Not checked
    validations:
      required: true
  - type: textarea
    id: deviations
    attributes:
      label: Values that differ
      description: Topic, value in HeishaMon, value on the remote controller or in the cloud.
  - type: textarea
    id: commands
    attributes:
      label: Commands tested
      description: Command, value sent, and whether the heat pump took it over. Leave empty if you only read values.
  - type: textarea
    id: faults
    attributes:
      label: Error codes or unexpected behaviour
      description: For example an H or F error code after a command, and what you did to clear it.
  - type: textarea
    id: notes
    attributes:
      label: Installation and notes
      description: Installed parts that matter (DHW tank, buffer tank, solar, pool, second zone, optional PCB, bivalent heater), and anything else.
